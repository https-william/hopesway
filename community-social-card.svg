<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F4"/>
      <stop offset="50%" stop-color="#F3ECE4"/>
      <stop offset="100%" stop-color="#EAF4F1"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="600" rx="32" fill="url(#bgGrad)"/>

  <!-- Hand-drawn double outer border doodle -->
  <path d="M 40 40 Q 400 32 760 42 Q 768 300 758 560 Q 400 568 42 558 Q 32 300 40 40 Z" 
        fill="none" stroke="#2E6B5E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M 46 48 Q 400 42 752 50 Q 760 300 750 552 Q 400 560 48 550 Q 38 300 46 48 Z" 
        fill="none" stroke="#E4572E" stroke-width="2" stroke-dasharray="8 12" stroke-linecap="round" opacity="0.7"/>

  <!-- Top-left leaves -->
  <path d="M 55 55 Q 90 70 120 60 Q 100 95 85 130" fill="none" stroke="#468C2C" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="60" r="7" fill="#F4B320"/>
  <circle cx="105" cy="80" r="6" fill="#F4B320"/>
  <circle cx="85" cy="130" r="7" fill="#F4B320"/>

  <!-- Bottom-right leaves -->
  <path d="M 745 545 Q 710 530 680 540 Q 700 505 715 470" fill="none" stroke="#468C2C" stroke-width="3" stroke-linecap="round"/>
  <circle cx="680" cy="540" r="7" fill="#F4B320"/>
  <circle cx="695" cy="520" r="6" fill="#F4B320"/>
  <circle cx="715" cy="470" r="7" fill="#F4B320"/>

  <!-- Center Hopesway Emblem -->
  <g transform="translate(400, 130)">
    <g transform="translate(0, -46) rotate(45)"><rect x="-24" y="-24" width="48" height="48" rx="11" fill="#EE2737"/></g>
    <g transform="translate(-42, -2) rotate(45)"><rect x="-24" y="-24" width="48" height="48" rx="11" fill="#468C2C"/></g>
    <g transform="translate(42, -2) rotate(45)"><rect x="-24" y="-24" width="48" height="48" rx="11" fill="#F4B320"/></g>
    <g stroke="#392E2D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="0" y1="70" x2="0" y2="-46"/>
      <line x1="0" y1="36" x2="-42" y2="-2"/>
      <line x1="0" y1="36" x2="42" y2="-2"/>
    </g>
  </g>

  <!-- Friendly Hand-drawn Title -->
  <text x="400" y="260" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="40" font-weight="800" fill="#1C2B2B" letter-spacing="-0.5">
    See More Stories
  </text>
  <text x="400" y="300" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="20" font-weight="500" fill="#6B7280">
    Follow daily life with Hopesway on social media
  </text>

  <!-- Hand-drawn scribble underline -->
  <path d="M 260 318 Q 400 328 540 316 M 290 324 Q 400 332 510 322" fill="none" stroke="#2E6B5E" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Social Platform Badges -->
  <!-- Facebook Badge -->
  <g transform="translate(250, 395)">
    <rect x="-130" y="-36" width="260" height="72" rx="36" fill="#1877F2"/>
    <text x="-5" y="4" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">
      Facebook
    </text>
    <text x="-5" y="22" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.9)">
      /HopeswaySS
    </text>
  </g>

  <!-- Instagram Badge -->
  <g transform="translate(550, 395)">
    <defs>
      <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f09433"/>
        <stop offset="25%" stop-color="#e6683c"/>
        <stop offset="50%" stop-color="#dc2743"/>
        <stop offset="75%" stop-color="#cc2366"/>
        <stop offset="100%" stop-color="#bc1888"/>
      </linearGradient>
    </defs>
    <rect x="-130" y="-36" width="260" height="72" rx="36" fill="url(#igGrad)"/>
    <text x="-5" y="4" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">
      Instagram
    </text>
    <text x="-5" y="22" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.9)">
      @hopeswaycare
    </text>
  </g>

  <!-- Hand-drawn Call to Action Footer -->
  <g transform="translate(400, 510)">
    <rect x="-200" y="-22" width="400" height="44" rx="22" fill="#EAF4F1" stroke="#2E6B5E" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#2E6B5E">
      Tap here to explore more on social &#x2192;
    </text>
  </g>
</svg>